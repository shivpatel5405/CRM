{% extends 'base.html' %}

{% block title %}Delete Task - CRM System{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 border-top border-danger border-4 text-center p-4">
            <div class="text-danger fs-1 mb-2">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h4 class="fw-bold">Delete Task?</h4>
            <p class="text-muted">Are you sure you want to delete task <strong>{{ task.title }}</strong>? This action cannot be undone.</p>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'task-detail' task.pk %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
